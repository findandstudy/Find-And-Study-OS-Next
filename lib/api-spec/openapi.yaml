    CreateLeadFromConversationResponse:
      type: object
      properties:
        ok:
          type: boolean
        leadId:
          type: integer
      required:
        - ok
        - leadId

    LeadExistsConflict:
      type: object
      properties:
        error:
          type: string
          enum: [LEAD_EXISTS]
        candidate:
          type: object
          properties:
            id:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: ["string", "null"]
            phone:
              type: ["string", "null"]
            status:
              type: string
          required:
            - id
            - firstName
            - lastName
            - status
      required:
        - error
        - candidate

    PortalSubmission:
      type: object
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        studentId: { type: integer }
        universityKey: { type: string }
        universityName: { type: string }
        mode:
          type: string
          enum: [dry, real]
        status:
          type: string
          enum: [queued, running, submitted, already_exists, program_missing, failed, canceled]
        externalRef: { type: string, nullable: true }
        resultJson: { type: object, nullable: true }
        screenshotUrls: { type: array, items: { type: string }, nullable: true }
        error: { type: string, nullable: true }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lockedAt: { type: string, format: date-time, nullable: true }
        lockedBy: { type: string, nullable: true }
        enqueuedBy: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required: [id, applicationId, studentId, universityKey, universityName, mode, status, attempts, maxAttempts, createdAt, updatedAt]

    EnqueuePortalSubmissionBody:
      type: object
      properties:
        universityKey: { type: string, minLength: 1 }
        mode:
          type: string
          enum: [dry, real]
        confirm: { type: boolean }
      required: [universityKey, mode]

    ManualSubmitBody:
      type: object
      properties:
        applicationIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 100
        mode:
          type: string
          enum: [dry, real]
        confirm: { type: boolean }
      required: [applicationIds, mode]

    ManualSubmitResult:
      type: object
      properties:
        queued:
          type: array
          items:
            type: object
            properties:
              applicationId: { type: integer }
              submissionId: { type: integer }
              universityKey: { type: string }
            required: [applicationId, submissionId, universityKey]
        skipped:
          type: array
          items:
            type: object
            properties:
              applicationId: { type: integer }
              reason:
                type: string
                enum: [NOT_FOUND, NO_PORTAL, ALREADY_QUEUED]
              submissionId: { type: integer }
            required: [applicationId, reason]
      required: [queued, skipped]

    ApplyToAllBody:
      type: object
      properties:
        applicationId: { type: integer }
        mode:
          type: string
          enum: [dry, real]
        confirm: { type: boolean }
      required: [applicationId, mode]

    ApplyToAllItem:
      type: object
      properties:
        universityKey: { type: string }
        universityName: { type: string }
        outcome:
          type: string
          enum: [queued, excluded, no-program, duplicate, failed]
        message: { type: string }
        applicationId: { type: integer }
        submissionId: { type: integer }
        programName: { type: string }
        confidence: { type: number }
      required: [universityKey, universityName, outcome]

    ApplyToAllResult:
      type: object
      properties:
        mode:
          type: string
          enum: [dry, real]
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyToAllItem"
        counts:
          type: object
          properties:
            queued: { type: integer }
            excluded: { type: integer }
            noProgram: { type: integer }
            duplicate: { type: integer }
            failed: { type: integer }
          required: [queued, excluded, noProgram, duplicate, failed]
      required: [mode, results, counts]

    EligibleApplication:
      type: object
      properties:
        id: { type: integer }
        stage: { type: string }
        universityName: { type: string, nullable: true }
        studentFirstName: { type: string }
        studentLastName: { type: string }
        studentEmail: { type: string, nullable: true }
        portalUniversityKey: { type: string }
        portalUniversityName: { type: string }
      required: [id, stage, studentFirstName, studentLastName, portalUniversityKey, portalUniversityName]

    UniversityPortal:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        hasCredentials: { type: boolean }
      required: [key, label, hasCredentials]

    SetPortalCredentialsBody:
      type: object
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        extra:
          type: object
          additionalProperties: true
          nullable: true
      required: [username, password]

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    PortalProgramOption:
      type: object
      properties:
        v: { type: string }
        t: { type: string }
      required: [v, t]

    PortalProgramOptionsResponse:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/PortalProgramOption"
        cached: { type: boolean }
        stale: { type: boolean }
        fetchedAt: { type: string, format: date-time, nullable: true }
      required: [options, cached, stale]

    PortalProgramMapping:
      type: object
      properties:
        universityKey: { type: string }
        programOverrides:
          type: object
          additionalProperties: { type: string }
        synonyms:
          type: array
          items:
            type: array
            items: { type: string }
        countryOverrides:
          type: object
          additionalProperties: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
      required: [universityKey, programOverrides, synonyms, countryOverrides]

    UpdatePortalProgramMappingBody:
      type: object
      properties:
        programOverrides:
          type: object
          additionalProperties: { type: string }
      required: [programOverrides]
