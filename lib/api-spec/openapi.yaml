          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityExclusion"
        "409":
          description: An exclusion for this nationality already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-automation/university-exclusions/{id}:
    patch:
      operationId: updateUniversityExclusion
      tags: [portal-automation]
      summary: Update an exclusion rule (nationality, agency, note, enabled)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUniversityExclusionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityExclusion"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An exclusion for this nationality already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUniversityExclusion
      tags: [portal-automation]
      summary: Soft-delete an exclusion rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

