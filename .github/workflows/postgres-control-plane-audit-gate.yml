name: PostgreSQL Control Plane Durable Audit Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-control-plane-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-control-plane-audit:
    name: PostgreSQL control-plane durable audit integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_DB: fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_PASSWORD: postgres_it_2026
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fas_it_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ALLOW_LIVE_INTEGRATIONS: "false"
      CI: "true"
      NODE_ENV: test
      NO_COLOR: "1"

    steps:
      - name: Check out the pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Activate the repository-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(pnpm --version)" = "10.33.2"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the migration ledger
        run: node lib/db/validate-migrations.mjs

      - name: Prepare disposable database roles
        env:
          PG_GATE_ADMIN_URL: postgresql://postgres:postgres_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_APP_URL: postgresql://fas_app:fas_app_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_MIGRATOR_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
        run: pnpm --filter @workspace/api-server run test:postgres-control-plane-gate -- setup

      - name: Apply all reviewed migrations as the migrator role
        working-directory: lib/db
        env:
          ALLOW_REVIEWED_MIGRATIONS: "true"
          DATABASE_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          MIGRATION_TARGET_ENV: test
        run: node ./run-migrations.mjs

      - name: Prove repeat migration application is clean
        working-directory: lib/db
        env:
          ALLOW_REVIEWED_MIGRATIONS: "true"
          DATABASE_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          MIGRATION_TARGET_ENV: test
        run: node ./run-migrations.mjs

      - name: Re-run the foundation negative and concurrency checks
        env:
          PG_GATE_ADMIN_URL: postgresql://postgres:postgres_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_APP_URL: postgresql://fas_app:fas_app_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_MIGRATOR_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
        run: pnpm --filter @workspace/api-server run test:postgres-control-plane-gate -- verify

      - name: Seed and prove the command/evidence adapter prerequisite
        env:
          PG_GATE_ADMIN_URL: postgresql://postgres:postgres_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_EXECUTOR_URL: postgresql://fas_cp_executor:fas_cp_executor_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_EVIDENCE_ISSUER_URL: postgresql://fas_evidence_issuer:fas_evidence_issuer_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_MIGRATOR_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
        run: pnpm --filter @workspace/api-server run test:postgres-change-set-adapter

      - name: Run the durable outer-attempt audit checks
        env:
          PG_GATE_ADMIN_URL: postgresql://postgres:postgres_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_AUDIT_WRITER_URL: postgresql://fas_audit_writer:fas_audit_writer_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_EXECUTOR_URL: postgresql://fas_cp_executor:fas_cp_executor_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_MIGRATOR_URL: postgresql://fas_migrator:fas_migrator_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
          PG_GATE_REPAIR_WORKER_URL: postgresql://fas_repair_worker:fas_repair_worker_it_2026@127.0.0.1:5432/fas_it_${{ github.run_id }}_${{ github.run_attempt }}
        run: pnpm --filter @workspace/api-server run test:postgres-change-set-audit
